<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>netActiv — Strategy. Design. Technology. Intelligence.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #070707;
      height: 100vh;
      overflow: hidden;
    }

    /* Full-screen glitch overlay — above everything, pointer-events:none */
    #glitch-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: none;
    }
    #glitch-overlay.active {
      display: block;
      animation: ov-tear 0.11s steps(1) infinite;
    }
    @keyframes ov-tear {
      0%   { opacity: 0.75; background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(153,0,0,0.07) 3px, rgba(153,0,0,0.07) 4px); transform: translateX(0); }
      11%  { opacity: 0.45; background: rgba(0,0,0,0.14);                                                                                                      transform: translateX(-10px); clip-path: inset(0 0 0 0); }
      22%  { opacity: 0.80; background: repeating-linear-gradient(to bottom, transparent 0, transparent 6px, rgba(0,40,160,0.05) 6px, rgba(0,40,160,0.05) 7px); transform: translateX(7px);  clip-path: inset(28% 0 42% 0); }
      33%  { opacity: 0;    background: transparent;                                                                                                            transform: translateX(0);    clip-path: inset(0 0 0 0); }
      44%  { opacity: 0.90; background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(153,0,0,0.10) 2px, rgba(153,0,0,0.10) 3px);  transform: translateX(-14px); clip-path: inset(62% 0 0 0); }
      55%  { opacity: 0.35; background: rgba(153,0,0,0.04);                                                                                                     transform: translateX(9px); }
      66%  { opacity: 0.60; background: repeating-linear-gradient(to bottom, transparent 0, transparent 4px, rgba(0,200,255,0.04) 4px, rgba(0,200,255,0.04) 5px); transform: translateX(0); clip-path: inset(0 0 0 0); }
      77%  { opacity: 0.20; background: rgba(0,0,0,0.10);                                                                                                       transform: translateX(-6px); }
      88%  { opacity: 0.50; background: rgba(153,0,0,0.03);                                                                                                     transform: translateX(5px); }
      100% { opacity: 0;    background: transparent;                                                                                                            transform: translateX(0); }
    }

    /* Canvas-only shake during overcaffed */
    body.overcaffed #home-globe {
      animation: page-shake 0.09s steps(1) infinite;
    }
    @keyframes page-shake {
      0%   { transform: translate(0,    0); }
      20%  { transform: translate(-5px,  2px); }
      40%  { transform: translate( 6px, -3px); }
      60%  { transform: translate(-3px,  4px); }
      80%  { transform: translate( 5px, -2px); }
      100% { transform: translate(0,    0); }
    }

    /* Full-viewport stage */
    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* Logo: absolute top-left */
    .logo {
      position: absolute;
      top: 42px;
      left: 75px;
      z-index: 2;
    }
    .logo img {
      width: clamp(260px, 33vw, 460px);
      display: block;
    }

    /* Canvas fills full viewport */
    .globe-wrap {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    #home-globe {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Glitch text — left side */
    #glitch-text {
      position: absolute;
      top: 50%;
      left: 4%;
      width: 42%;
      transform: translateY(-50%);
      font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: clamp(21px, 2.31vw, 29px);
      white-space: nowrap;
      letter-spacing: 0.22em;
      color: #990000;
      text-transform: uppercase;
      line-height: 1.7;
      opacity: 0;
      pointer-events: none;
    }
    #glitch-text.active {
      animation: gt-appear 0.08s ease forwards;
    }
    @keyframes gt-appear { from { opacity: 0; } to { opacity: 1; } }

    /* Footer: absolute bottom-left */
    footer {
      position: absolute;
      bottom: 80px;
      left: 75px;
      z-index: 2;
      font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #555555;
      letter-spacing: 0.03em;
    }

    @media (max-width: 600px) {
      .logo { top: 28px; left: 24px; }
      .logo img { width: clamp(200px, 55vw, 320px); }
      footer { left: 24px; bottom: 40px; }
    }
  </style>
</head>
<body>
  <div id="glitch-overlay"></div>
  <div class="page">
    <div class="logo">
      <img src="art/2026-logo_longw-tag.png" alt="netActiv">
    </div>
    <div class="globe-wrap">
      <canvas id="home-globe"></canvas>
      <div id="glitch-text" data-text="transmission arrival pending">transmission arrival pending</div>
    </div>
    <footer id="site-footer">&copy; 2026 netActiv</footer>
  </div>

  <script src="home-globe.js"></script>
</body>
</html>
