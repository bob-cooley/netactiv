name: FTP Deploy netActiv

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Build private Menagerie configuration
        env:
          MENAGERIE_ADMIN_PASSWORD: ${{ secrets.MENAGERIE_ADMIN_PASSWORD }}
        run: |
          mkdir -p .deploy-private
          php <<'PHP'
          <?php
          $password = getenv('MENAGERIE_ADMIN_PASSWORD');
          if (!is_string($password) || $password === '') {
              fwrite(STDERR, "Menagerie owner password is not configured.\n");
              exit(1);
          }
          $hash = password_hash($password, PASSWORD_DEFAULT);
          file_put_contents(
              '.deploy-private/admin-config.php',
              "<?php\nreturn " . var_export($hash, true) . ";\n"
          );
          PHP

      - name: Build private QRCodifier configuration
        env:
          QRCODIFIER_PASSWORD: ${{ secrets.QRCODIFIER_PASSWORD }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          mkdir -p .deploy-qrcodifier
          php <<'PHP'
          <?php
          $password = (string) getenv('QRCODIFIER_PASSWORD');
          $site = (string) getenv('TURNSTILE_SITE_KEY');
          $secret = (string) getenv('TURNSTILE_SECRET_KEY');
          if ($password === '' || $site === '' || $secret === '') {
              echo "::warning::QRCodifier secrets missing; login stays disabled until QRCODIFIER_PASSWORD, TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY are set.\n";
          }
          $config = [
              'password_hash' => $password === '' ? '' : password_hash($password, PASSWORD_DEFAULT),
              'turnstile_site' => $site,
              'turnstile_secret' => $secret,
          ];
          file_put_contents('.deploy-qrcodifier/config.php', "<?php\nreturn " . var_export($config, true) . ";\n");
          file_put_contents('.deploy-qrcodifier/.htaccess', "Require all denied\n");
          PHP

      - name: Upload public site to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: public_html/netactiv/
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            .github/**
            .deploy-private/**
            menagerie-data/**
            .deploy-cutethulhu/**
            .deploy-qrcodifier/**
            qrcodifier-data/**
            **/*.md
            **/_notes/**

      - name: Upload private Menagerie configuration
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          local-dir: ./.deploy-private/
          server-dir: public_html/netactiv/menagerie-data/
          log-level: standard

      - name: Upload private QRCodifier configuration
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          local-dir: ./.deploy-qrcodifier/
          server-dir: public_html/netactiv/qrcodifier-data/config/
          log-level: standard
