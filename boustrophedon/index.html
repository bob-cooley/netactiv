<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boustrophedon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Nunito:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;1,400&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg: #0a0a0a;
      --bg2: #131313;
      --bg3: #1c1c1c;
      --border: #272727;
      --text: #d8d8d8;
      --muted: #555;
      --accent: rgb(220,30,130);
      --overlay: rgba(0,0,0,0.78);
      --shadow: rgba(0,0,0,0.6);
    }
    :root[data-theme="light"] {
      --bg: #f2f2f2;
      --bg2: #ffffff;
      --bg3: #e8e8e8;
      --border: #d0d0d0;
      --text: #1a1a1a;
      --muted: #999;
      --accent: rgb(190,10,100);
      --overlay: rgba(0,0,0,0.5);
      --shadow: rgba(0,0,0,0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      position: fixed;
      top: 0; right: 0;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }

    .btn-theme {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      color: var(--muted);
      box-shadow: 0 2px 8px var(--shadow);
      transition: border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .btn-theme:hover { border-color: var(--accent); color: var(--accent); }

    .btn-main {
      padding: 8px 16px;
      background: linear-gradient(to bottom, var(--bg3) 0%, var(--bg2) 100%);
      border: 1px solid var(--border);
      border-radius: 5px;
      box-shadow:
        0 2px 0 0 var(--border),
        0 4px 10px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.05);
      cursor: pointer;
      color: var(--accent);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      transition: transform 0.07s, box-shadow 0.07s;
    }
    .btn-main:hover {
      box-shadow:
        0 2px 0 0 var(--accent),
        0 6px 14px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.07);
    }
    .btn-main:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 0 var(--border), 0 2px 4px var(--shadow);
    }

    /* ── Display ─────────────────────────────────────────────────────────── */
    #stage {
      position: fixed;
      inset: 0;
      padding: 72px 7vw 72px;
      overflow: hidden;
    }
    #stage-inner {
      width: 100%;
      will-change: transform;
    }

    .b-line {
      display: flex;
      align-items: baseline;
      flex-wrap: nowrap;
      width: 100%;
      gap: 0.28em;
    }
    .b-line.rtl { flex-direction: row-reverse; }

    .b-word {
      display: inline-block;
      white-space: pre;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .b-word.on { opacity: 1; }

    /* ── Idle hint ───────────────────────────────────────────────────────── */
    #hint {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #hint.gone { opacity: 0; }
    #hint-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Modal overlay ───────────────────────────────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: var(--overlay);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }
    #overlay.open { display: flex; }

    #modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: min(620px, 93vw);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 72px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .m-head {
      padding: 22px 26px 0;
      flex-shrink: 0;
    }
    .m-eyebrow {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 9px 18px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.05em;
      color: var(--muted);
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.on { color: var(--accent); border-bottom-color: var(--accent); }

    .m-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 26px 20px;
    }

    .panel { display: none; padding-top: 20px; }
    .panel.on { display: block; }

    /* Drop zone */
    .drop {
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop:hover, .drop.over { border-color: var(--accent); background: rgba(220,30,130,0.03); }
    .drop p { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .drop strong { color: var(--text); }
    .drop small { font-size: 11px; margin-top: 6px; display: block; color: var(--muted); opacity: 0.7; }
    #file-name { font-size: 11px; color: var(--accent); margin-top: 8px; min-height: 14px; }
    #file-in { display: none; }

    textarea {
      width: 100%;
      height: 150px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 14px;
      resize: vertical;
      outline: none;
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }

    /* Section header */
    .sec {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 7px;
      margin: 24px 0 16px;
    }

    /* Form rows */
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;
    }
    .lbl {
      font-size: 12px;
      color: var(--muted);
      width: 110px;
      flex-shrink: 0;
    }
    .ctl { flex: 1; display: flex; align-items: center; gap: 10px; }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .rval {
      font-size: 11px;
      color: var(--muted);
      width: 42px;
      text-align: right;
    }

    select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    select:focus { border-color: var(--accent); }

    input[type="color"] {
      width: 38px; height: 30px;
      padding: 2px 3px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    /* Toggle */
    .tog { position: relative; width: 38px; height: 20px; display: inline-flex; }
    .tog input { opacity: 0; width: 0; height: 0; }
    .tog-track {
      position: absolute; inset: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .tog input:checked + .tog-track { background: var(--accent); border-color: var(--accent); }
    .tog-track::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      top: 2px; left: 2px;
      transition: transform 0.18s;
    }
    .tog input:checked + .tog-track::after { transform: translateX(18px); }

    /* Modal footer */
    .m-foot {
      padding: 16px 26px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-sec {
      padding: 8px 18px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-sec:hover { color: var(--text); border-color: var(--muted); }
    .btn-go {
      padding: 8px 22px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-go:hover { opacity: 0.82; }
  </style>
</head>
<body>

<header>
  <button class="btn-theme" id="btn-theme">◑</button>
  <button class="btn-main" id="btn-open">[ boustrophedonize! ]</button>
</header>

<div id="stage"><div id="stage-inner"></div></div>

<div id="hint"><div id="hint-label">boustrophedon</div></div>

<!-- Modal -->
<div id="overlay">
  <div id="modal">
    <div class="m-head">
      <div class="m-eyebrow">configure</div>
      <div class="tabs">
        <button class="tab on" data-p="upload">upload file</button>
        <button class="tab" data-p="paste">paste text</button>
      </div>
    </div>

    <div class="m-body">

      <!-- Upload panel -->
      <div class="panel on" id="p-upload">
        <div class="drop" id="drop">
          <p><strong>drag &amp; drop</strong> a file here<br>or click to select</p>
          <small>txt · docx · pdf</small>
          <div id="file-name"></div>
          <input type="file" id="file-in" accept=".txt,.docx,.pdf">
        </div>
      </div>

      <!-- Paste panel -->
      <div class="panel" id="p-paste">
        <textarea id="txt-in" placeholder="paste or type text here…"></textarea>
      </div>

      <!-- Style -->
      <div class="sec">style</div>

      <div class="row">
        <span class="lbl">color</span>
        <div class="ctl"><input type="color" id="c-color" value="#d8d8d8"></div>
      </div>
      <div class="row">
        <span class="lbl">size</span>
        <div class="ctl">
          <input type="range" id="c-size" min="12" max="80" value="26">
          <span class="rval" id="v-size">26px</span>
        </div>
      </div>
      <div class="row">
        <span class="lbl">font</span>
        <div class="ctl">
          <select id="c-font">
            <option value="'Nunito', sans-serif">Nunito — geometric sans</option>
            <option value="'Inter', sans-serif" selected>Inter — modern sans</option>
            <option value="'Playfair Display', serif">Playfair Display — editorial serif</option>
            <option value="'Space Mono', monospace">Space Mono — monospace</option>
            <option value="'EB Garamond', serif">EB Garamond — classical serif</option>
          </select>
        </div>
      </div>
      <div class="row">
        <span class="lbl">line height</span>
        <div class="ctl">
          <input type="range" id="c-lh" min="1.0" max="3.0" step="0.1" value="1.7">
          <span class="rval" id="v-lh">1.7</span>
        </div>
      </div>
      <div class="row">
        <span class="lbl">letter spacing</span>
        <div class="ctl">
          <input type="range" id="c-ls" min="-1" max="16" step="0.5" value="0">
          <span class="rval" id="v-ls">0px</span>
        </div>
      </div>

      <!-- Settings -->
      <div class="sec">settings</div>

      <div class="row">
        <span class="lbl">speed</span>
        <div class="ctl">
          <input type="range" id="c-speed" min="1" max="100" value="50">
          <span class="rval" id="v-speed">50</span>
        </div>
      </div>
      <div class="row">
        <span class="lbl">stream by</span>
        <div class="ctl">
          <select id="c-by">
            <option value="letter">letter</option>
            <option value="word" selected>word</option>
            <option value="sentence">sentence</option>
          </select>
        </div>
      </div>
      <div class="row">
        <span class="lbl">loop</span>
        <div class="ctl">
          <label class="tog">
            <input type="checkbox" id="c-loop">
            <div class="tog-track"></div>
          </label>
        </div>
      </div>

    </div><!-- /m-body -->

    <div class="m-foot">
      <button class="btn-sec" id="btn-cancel">cancel</button>
      <button class="btn-go" id="btn-run">run →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.4.21/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
(function () {
  'use strict';

  // ── PDF.js worker ──────────────────────────────────────────────────────────
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }

  // ── Config ─────────────────────────────────────────────────────────────────
  const cfg = {
    color:   '#d8d8d8',
    size:    26,
    font:    "'Inter', sans-serif",
    lh:      1.7,
    ls:      0,
    speed:   50,
    by:      'word',
    loop:    false
  };

  // ── Helpers ───────────────────────────────────────────────────────────────
  function $  (id) { return document.getElementById(id); }
  function qs (sel) { return document.querySelector(sel); }
  function qsa(sel) { return document.querySelectorAll(sel); }

  // ── Theme toggle ───────────────────────────────────────────────────────────
  let dark = true;
  $('btn-theme').addEventListener('click', () => {
    dark = !dark;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('btn-theme').textContent = dark ? '◑' : '◐';
  });

  // ── Modal ──────────────────────────────────────────────────────────────────
  $('btn-open').addEventListener('click', openModal);
  $('btn-cancel').addEventListener('click', closeModal);
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeModal(); });
  function openModal()  { $('overlay').classList.add('open'); }
  function closeModal() { $('overlay').classList.remove('open'); }

  // ── Tabs ───────────────────────────────────────────────────────────────────
  qsa('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      qsa('.tab').forEach(t => t.classList.remove('on'));
      qsa('.panel').forEach(p => p.classList.remove('on'));
      tab.classList.add('on');
      $('p-' + tab.dataset.p).classList.add('on');
    });
  });

  // ── File upload ────────────────────────────────────────────────────────────
  let fileText = '';
  const drop   = $('drop');
  const fileIn = $('file-in');

  drop.addEventListener('click', () => fileIn.click());
  drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });
  fileIn.addEventListener('change', () => { if (fileIn.files[0]) readFile(fileIn.files[0]); });

  function readFile(file) {
    $('file-name').textContent = file.name;
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'txt') {
      const r = new FileReader();
      r.onload = e => { fileText = e.target.result; };
      r.readAsText(file);
    } else if (ext === 'docx') {
      const r = new FileReader();
      r.onload = e => {
        mammoth.extractRawText({ arrayBuffer: e.target.result })
          .then(res => { fileText = res.value; })
          .catch(() => { $('file-name').textContent = 'could not read file'; });
      };
      r.readAsArrayBuffer(file);
    } else if (ext === 'pdf') {
      const r = new FileReader();
      r.onload = async e => {
        try {
          const pdf = await pdfjsLib.getDocument({ data: e.target.result }).promise;
          let out = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            out += content.items.map(x => x.str).join(' ') + '\n';
          }
          fileText = out.trim();
        } catch {
          $('file-name').textContent = 'could not read pdf';
        }
      };
      r.readAsArrayBuffer(file);
    }
  }

  // ── Config controls ────────────────────────────────────────────────────────
  $('c-color').addEventListener('input',  e => { cfg.color = e.target.value; });
  $('c-font').addEventListener('change',  e => { cfg.font  = e.target.value; });
  $('c-by').addEventListener('change',    e => { cfg.by    = e.target.value; });
  $('c-loop').addEventListener('change',  e => { cfg.loop  = e.target.checked; });

  function rangeCtrl(id, vid, suffix, key, factor) {
    const el = $(id), vl = $(vid);
    el.addEventListener('input', () => {
      const v = parseFloat(el.value);
      cfg[key] = factor ? v * factor : v;
      vl.textContent = v + suffix;
    });
  }
  rangeCtrl('c-size',  'v-size',  'px', 'size',  null);
  rangeCtrl('c-lh',    'v-lh',    '',   'lh',    null);
  rangeCtrl('c-ls',    'v-ls',    'px', 'ls',    null);
  rangeCtrl('c-speed', 'v-speed', '',   'speed', null);

  // ── Run ────────────────────────────────────────────────────────────────────
  $('btn-run').addEventListener('click', () => {
    const activePanelId = qs('.tab.on').dataset.p;
    const text = activePanelId === 'paste'
      ? $('txt-in').value.trim()
      : fileText.trim();
    if (!text) return;
    closeModal();
    startDisplay(text);
  });

  // ── Word wrap (canvas measurement) ────────────────────────────────────────
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');

  function wrapText(text, maxW) {
    // Strip the css font string to something canvas understands
    const fontFace = cfg.font.replace(/'/g, '').split(',')[0].trim();
    mctx.font = `${cfg.size}px ${fontFace}`;
    const spaceW = mctx.measureText(' ').width + cfg.ls;

    const rawLines = text.replace(/\r\n/g, '\n').split('\n');
    const lines = [];

    for (const raw of rawLines) {
      const words = raw.trim().split(/\s+/).filter(Boolean);
      if (!words.length) { lines.push([]); continue; }

      let cur = [];
      let curW = 0;

      for (const word of words) {
        const ww = mctx.measureText(word).width + word.length * cfg.ls;
        const needed = cur.length ? curW + spaceW + ww : ww;
        if (needed > maxW && cur.length) {
          lines.push(cur);
          cur  = [word];
          curW = ww;
        } else {
          cur.push(word);
          curW = needed;
        }
      }
      if (cur.length) lines.push(cur);
    }
    return lines; // array of word arrays
  }

  // ── Build stream events ────────────────────────────────────────────────────
  // Each event: {type:'line', el} | {type:'show', el} | {type:'text', el, t}

  function buildStream(lines) {
    const events = [];

    lines.forEach((words, li) => {
      const isRTL = li % 2 !== 0;

      const lineEl = document.createElement('div');
      lineEl.className = 'b-line' + (isRTL ? ' rtl' : '');
      lineEl.style.cssText =
        `font-family:${cfg.font};` +
        `font-size:${cfg.size}px;` +
        `line-height:${cfg.lh};` +
        `letter-spacing:${cfg.ls}px;` +
        `color:${cfg.color};`;

      events.push({ type: 'line', el: lineEl });

      if (!words.length) return; // empty / blank line

      if (cfg.by === 'sentence') {
        // Whole line appears at once
        const span = document.createElement('span');
        span.className = 'b-word';
        span.textContent = words.join(' ');
        lineEl.appendChild(span);
        events.push({ type: 'show', el: span });

      } else if (cfg.by === 'word') {
        words.forEach(word => {
          const span = document.createElement('span');
          span.className = 'b-word';
          span.textContent = word;
          lineEl.appendChild(span);
          events.push({ type: 'show', el: span });
        });

      } else { // letter
        // Each word is a flex item (for RTL row-reverse positioning)
        // Letters build up inside each word span
        words.forEach(word => {
          const wspan = document.createElement('span');
          wspan.className = 'b-word on'; // always visible; text builds inside
          wspan.textContent = '';
          lineEl.appendChild(wspan);
          for (let ci = 1; ci <= word.length; ci++) {
            events.push({ type: 'text', el: wspan, t: word.slice(0, ci) });
          }
        });
      }
    });

    return events;
  }

  // ── Animation ──────────────────────────────────────────────────────────────
  const stage      = $('stage');
  const stageInner = $('stage-inner');
  const hint       = $('hint');

  let events    = [];
  let evIdx     = 0;
  let animTimer = null;
  let scrollY   = 0;
  let rafId     = null;

  // Speed → delay ms: speed 1 = ~500ms, 50 = ~55ms, 100 = ~6ms
  function delay() {
    return Math.max(4, Math.round(500 * Math.pow(0.955, cfg.speed - 1)));
  }

  function startDisplay(text) {
    stopAnim();
    stageInner.innerHTML = '';
    stageInner.style.transform = 'translateY(0)';
    scrollY = 0;
    hint.classList.add('gone');

    const padL  = parseFloat(getComputedStyle(stage).paddingLeft);
    const padR  = parseFloat(getComputedStyle(stage).paddingRight);
    const maxW  = stage.clientWidth - padL - padR;

    const lines = wrapText(text, maxW);
    events = buildStream(lines);
    evIdx  = 0;

    tick();
  }

  function tick() {
    if (evIdx >= events.length) {
      if (cfg.loop) {
        animTimer = setTimeout(() => {
          stageInner.innerHTML = '';
          stageInner.style.transform = 'translateY(0)';
          scrollY = 0;
          // reset 'on' classes; rebuild from same events array
          events.forEach(ev => {
            if (ev.type === 'show') ev.el.className = 'b-word';
            if (ev.type === 'text') ev.el.textContent = '';
          });
          evIdx = 0;
          tick();
        }, 1200);
      }
      return;
    }

    const ev = events[evIdx++];

    if (ev.type === 'line') {
      stageInner.appendChild(ev.el);
      autoScroll();
      tick(); // lines append immediately, no delay
      return;
    }
    if (ev.type === 'show') {
      ev.el.classList.add('on');
      autoScroll();
    }
    if (ev.type === 'text') {
      ev.el.textContent = ev.t;
      autoScroll();
    }

    animTimer = setTimeout(tick, delay());
  }

  function stopAnim() {
    if (animTimer) { clearTimeout(animTimer); animTimer = null; }
    if (rafId)     { cancelAnimationFrame(rafId); rafId = null; }
  }

  function autoScroll() {
    const stageH  = stage.clientHeight
      - parseFloat(getComputedStyle(stage).paddingTop)
      - parseFloat(getComputedStyle(stage).paddingBottom);
    const innerH  = stageInner.scrollHeight;
    const target  = Math.max(0, innerH - stageH);

    if (target <= scrollY) return;

    if (rafId) cancelAnimationFrame(rafId);
    animateScroll(target);
  }

  function animateScroll(target) {
    if (Math.abs(scrollY - target) < 0.5) {
      scrollY = target;
      stageInner.style.transform = `translateY(-${scrollY}px)`;
      return;
    }
    scrollY += (target - scrollY) * 0.08;
    stageInner.style.transform = `translateY(-${scrollY}px)`;
    rafId = requestAnimationFrame(() => animateScroll(target));
  }

})();
</script>
</body>
</html>
