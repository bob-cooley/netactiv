<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #02030a;
      --text: #8e9bd6;
      --accent: #00c8e0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }
    canvas#neuro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 2.4s ease;
    }
    canvas#neuro.ready { opacity: 1; }
    .mark {
      position: fixed;
      left: 28px;
      bottom: 24px;
      font-family: 'Century Gothic Pro', 'Century Gothic', 'Futura', sans-serif;
      font-size: 13px;
      letter-spacing: 0.32em;
      text-transform: lowercase;
      color: var(--text);
      opacity: 0.55;
      pointer-events: none;
      user-select: none;
    }
    .fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'Century Gothic Pro', 'Century Gothic', sans-serif;
      color: var(--text);
      letter-spacing: 0.2em;
      text-transform: lowercase;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="neuro"></canvas>
  <div class="mark">neuro</div>
  <div class="fallback" id="fallback">webgl unavailable</div>
  <script type="module" src="neuro.js?v=19"></script>
  <script type="module" src="settings.js?v=18"></script>
</body>
</html>
