<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuralvex IV — netActiv</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #02040d;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #neuralvex-canvas {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #neuralvex-canvas:active {
      cursor: grabbing;
    }

    /* netActiv wordmark — top left */
    .brand {
      position: fixed;
      top: 32px;
      left: 36px;
      z-index: 10;
    }

    .brand img {
      width: 220px;
      opacity: 0.60;
    }

    /* Label — bottom left */
    .label {
      position: fixed;
      bottom: 36px;
      left: 38px;
      z-index: 10;
      pointer-events: none;
      font-family: 'Inter', Helvetica Neue, sans-serif;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .label .planet {
      font-size: 11px;
      color: rgba(0, 195, 255, 0.42);
    }

    .label .name {
      font-size: 28px;
      font-weight: 300;
      color: rgba(80, 222, 255, 0.78);
      line-height: 1.1;
      letter-spacing: 0.22em;
    }

    /* Stats — bottom right */
    .stats {
      position: fixed;
      bottom: 36px;
      right: 38px;
      z-index: 10;
      pointer-events: none;
      font-family: 'Inter', Helvetica Neue, sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: rgba(0, 185, 230, 0.38);
      text-align: right;
      line-height: 1.9;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <canvas id="neuralvex-canvas"></canvas>

  <div class="brand">
    <a href="/"><img src="../art/na-logo-long.svg" alt="netActiv"></a>
  </div>

  <div class="label">
    <div class="planet">Neuralvex System &middot; Class IV</div>
    <div class="name">Neuralvex IV</div>
  </div>

  <div class="stats">
    <div>Core Nodes &nbsp;&nbsp; 4.7 &times; 10&sup9;</div>
    <div>Throughput &nbsp; 847 Pb/s</div>
    <div>Uptime &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 99.997%</div>
    <div>Sectors &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 2,048</div>
  </div>

  <script src="jupiter.js?v=3"></script>
</body>
</html>
